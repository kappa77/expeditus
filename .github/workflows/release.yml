name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.7"
          cache: true

      - name: Set version from tag
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -match '^v([0-9]+\.[0-9]+\.[0-9]+)$') {
            $version = $Matches[1]
            $build = "${{ github.run_number }}"
            $pubspec = Get-Content pubspec.yaml -Raw
            $pubspec = [regex]::Replace($pubspec, '(?m)^version:\s*.*$', "version: $version+$build")
            Set-Content pubspec.yaml $pubspec -NoNewline
            "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "APP_BUILD=$build" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          } else {
            $match = [regex]::Match((Get-Content pubspec.yaml -Raw), '(?m)^version:\s*([0-9]+\.[0-9]+\.[0-9]+)\+([0-9]+)')
            if (-not $match.Success) { throw "Cannot read version from pubspec.yaml" }
            "APP_VERSION=$($match.Groups[1].Value)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "APP_BUILD=$($match.Groups[2].Value)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }

      - name: Flutter dependencies
        run: flutter pub get

      - name: Fetch media_kit Windows libraries
        shell: pwsh
        run: ./tool/fetch_windows_deps.ps1

      - name: Build Windows release
        shell: pwsh
        run: flutter build windows --release "--dart-define=APP_VERSION=$env:APP_VERSION"

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --no-progress -y

      - name: Build installer
        shell: pwsh
        run: ./tool/build_installer.ps1 -SkipFlutterBuild -Version $env:APP_VERSION -Build $env:APP_BUILD

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: expeditus-windows-installer
          path: |
            dist/ExpeditusSetup-*.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.7"
          cache: true

      - name: Set version from tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          fi

      - name: Flutter dependencies
        run: flutter pub get

      - name: Build Android APK
        run: |
          if [[ -n "$APP_VERSION" ]]; then
            flutter build apk --release --dart-define="APP_VERSION=$APP_VERSION"
          else
            flutter build apk --release
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: expeditus-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  publish:
    needs: [build-windows-installer, build-android-apk]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          name: expeditus-windows-installer
          path: dist

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: expeditus-android-apk
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Expeditus ${{ github.ref_name }}
          files: |
            dist/ExpeditusSetup-*.exe
            dist/SHA256SUMS.txt
            dist/app-release.apk
          generate_release_notes: true
