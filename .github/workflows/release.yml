name: Release Windows installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.7"
          cache: true

      - name: Flutter dependencies
        run: flutter pub get

      - name: Fetch media_kit Windows libraries
        shell: pwsh
        run: ./tool/fetch_windows_deps.ps1

      - name: Build Windows release
        run: flutter build windows --release

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --no-progress -y

      - name: Build installer
        shell: pwsh
        run: ./tool/build_installer.ps1 -SkipFlutterBuild

      - name: Check tag matches pubspec version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $pubspec = Get-Content pubspec.yaml -Raw
          $match = [regex]::Match($pubspec, '(?m)^version:\s*([0-9]+\.[0-9]+\.[0-9]+)\+')
          if (-not $match.Success) { throw "Cannot read version from pubspec.yaml" }
          $expected = "v" + $match.Groups[1].Value
          if ($tag -ne $expected) {
            throw "Tag $tag does not match pubspec version $expected"
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: expeditus-windows-installer
          path: |
            dist/ExpeditusSetup-*.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Expeditus ${{ github.ref_name }}
          files: |
            dist/ExpeditusSetup-*.exe
            dist/SHA256SUMS.txt
          generate_release_notes: true
